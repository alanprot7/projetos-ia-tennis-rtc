<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Racket handle -->
  <rect x="28" y="38" width="4" height="18" rx="1" fill="#8B4513"/>
  <rect x="27" y="52" width="6" height="4" rx="1" fill="#A0522D"/>

  <!-- Racket head (oval) -->
  <ellipse cx="30" cy="22" rx="14" ry="18" fill="none" stroke="#8B4513" stroke-width="3"/>

  <!-- Racket strings (vertical) -->
  <line x1="24" y1="8" x2="23" y2="36" stroke="#CCAA66" stroke-width="0.5"/>
  <line x1="27" y1="6" x2="27" y2="38" stroke="#CCAA66" stroke-width="0.5"/>
  <line x1="30" y1="5" x2="30" y2="39" stroke="#CCAA66" stroke-width="0.5"/>
  <line x1="33" y1="6" x2="33" y2="38" stroke="#CCAA66" stroke-width="0.5"/>
  <line x1="36" y1="8" x2="37" y2="36" stroke="#CCAA66" stroke-width="0.5"/>

  <!-- Racket strings (horizontal) -->
  <line x1="18" y1="14" x2="42" y2="16" stroke="#CCAA66" stroke-width="0.5"/>
  <line x1="17" y1="19" x2="43" y2="19" stroke="#CCAA66" stroke-width="0.5"/>
  <line x1="17" y1="24" x2="43" y2="24" stroke="#CCAA66" stroke-width="0.5"/>
  <line x1="18" y1="29" x2="42" y2="29" stroke="#CCAA66" stroke-width="0.5"/>

  <!-- Tennis ball -->
  <circle cx="44" cy="36" r="7" fill="#CCFF00"/>
  <!-- Ball lines -->
  <path d="M39 33 Q44 36 49 33" fill="none" stroke="#fff" stroke-width="1"/>
  <path d="M39 39 Q44 36 49 39" fill="none" stroke="#fff" stroke-width="1"/>
</svg>
